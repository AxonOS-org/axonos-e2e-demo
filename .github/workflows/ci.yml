name: e2e-demo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  reproduce:
    name: Reproduce end-to-end demo (bit-exact + hashes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify deterministic reproduction
        run: ./run.sh --verify
      - name: Sample app runs on typed intent
        run: python3 examples/cursor_app.py expected/intent_observations.jsonl
